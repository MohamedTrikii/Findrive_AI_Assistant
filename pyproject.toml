[project]
name = "findrive-assistant"
version = "1.0.0"
description = "Assistant conversationnel de recherche de voitures d'occasion (Streamlit, analyse par règles, hors ligne)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohamed Trikii" }]
requires-python = ">=3.10"
dependencies = ["streamlit>=1.42"]
keywords = ["streamlit", "chatbot", "nlp", "rule-based", "search", "cars"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: French",
    "Framework :: Streamlit",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
e2e = ["playwright>=1.45"]

[project.urls]
Repository = "https://github.com/MohamedTrikii/AutoMind_AI_Assistant"

[tool.setuptools]
packages = ["findrive"]

[tool.setuptools.package-data]
findrive = ["assets/*.png"]

# ------------------------------------------------------------------ tests
[tool.pytest.ini_options]
# `pytest` exécute la suite principale (tests/).
# Campagne QA complète (intégration, régression, navigateur) : pytest qa/test_code
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [".*", "__pycache__", "qa", "docs"]
addopts = "-ra"

[tool.coverage.run]
source = ["findrive"]
omit = ["findrive/ui.py"]

# ------------------------------------------------------------------ lint
[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["qa/baseline_src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["findrive"]
