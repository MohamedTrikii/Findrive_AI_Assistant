name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Jeu de données reproductible (graine 42)
        run: |
          python -m findrive.generate_cars --summary ""
          git diff --exit-code data/cars.json
      - name: Tests unitaires, fonctionnels et Streamlit AppTest
        run: pytest --cov --cov-report=term-missing

  qa-campaign:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt playwright
      - name: Campagne QA complète (unitaires, intégration, cas limites, régression, navigateur)
        env:
          TEST_PHASE: ci
        run: pytest qa/test_code -q
      - name: Captures d'écran de la campagne
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qa-screenshots
          path: qa/screenshots/
          retention-days: 14
