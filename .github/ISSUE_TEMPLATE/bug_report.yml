name: 🐛 Signaler un bug
description: Un comportement incorrect de l'assistant ou de l'interface
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes pour reproduire
      description: Les messages envoyés à l'assistant, dans l'ordre.
      placeholder: |
        1. « Je cherche une voiture diesel à Sfax »
        2. « Budget maximum 40 000 DT »
        3. ...
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: input
    id: environnement
    attributes:
      label: Environnement
      placeholder: "Windows 11, Python 3.12, Chrome 131 / Docker"
  - type: textarea
    id: captures
    attributes:
      label: Captures d'écran ou journaux
